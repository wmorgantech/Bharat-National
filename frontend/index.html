<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bharat National Computers</title>

    <!-- Tailwind is compiled at build time (tailwind.config.js + src/index.css) -->

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Space Grotesk drives `font-display` headings, DM Sans the body text.
         Both are declared in tailwind.config.js; before this they were never
         loaded, so every heading silently fell back to generic sans-serif.
         Inter is kept as the final web-safe step in the stack. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Global CSS Variables -->
    <style>
      :root {
        --primary: #00897b;
        --primary-dark: #00695c;
        --primary-light: #26a69a;
        --primary-lighthead: #c9ceccff;
        --primary-breadcrumb: #0f615dff;

    
        --grey-100: #f2f4f7;
        --grey-200: #e4e6eb;
        --grey-300: #d0d5dd;
        --grey-600: #a2a6ad;
        --grey-700: #344054;
        --grey-900: #1a1a1a;

        --text-dark: #000000;
        --text-light: #ffffff;

        --success: #2ecc71;
        --warning: #f1c40f;
        --danger: #e74c3c;

        



        --radius: 8px;
        --shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }

      body {
        background: #050A12;
        color: rgba(255,255,255,0.85);
        font-family: "DM Sans", "Inter", system-ui, sans-serif;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
